name: Security Fix

# Dispatched by the security agent (security-agent.burke-ruder.workers.dev) when
# Dependabot has an open alert but no PR for it. Bumps the package in the given
# manifest directory and pushes a security-agent/* branch whose commit title is
# Dependabot-style; the agent opens the PR from that branch and merges it on a
# later sweep if checks pass and the bump is not a major version.

on:
  workflow_dispatch:
    inputs:
      manifest_dir:
        description: "Directory containing package.json (\".\" for repo root)"
        default: "."
      package:
        description: "npm package to update (blank = npm audit fix)"
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump
        id: bump
        working-directory: ${{ github.event.inputs.manifest_dir }}
        run: |
          set -e
          [ -f package-lock.json ] || { echo "no package-lock.json here — nothing to do"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; }
          PKG="${{ github.event.inputs.package }}"
          npm ci --ignore-scripts >/dev/null 2>&1 || npm install --ignore-scripts >/dev/null 2>&1
          lockver() { python3 -c "import json,sys; d=json.load(open('package-lock.json')); p=d.get('packages',{}); print(next((v.get('version','?') for k,v in p.items() if k.endswith('node_modules/'+sys.argv[1])), '?'))" "$1"; }
          before=$( [ -n "$PKG" ] && lockver "$PKG" || echo "-" )
          npm ci --ignore-scripts >/dev/null 2>&1 || npm install --ignore-scripts >/dev/null 2>&1
          if [ -n "$PKG" ]; then npm update "$PKG" --ignore-scripts || true; fi
          # A single-package update often can't move a pinned transitive dep; fall back to
          # npm audit fix (never --force, so no major bumps) for everything fixable here.
          if [ -z "$PKG" ] || git diff --quiet -- package-lock.json; then PKG=""; npm audit fix --ignore-scripts || true; fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          after=$( [ -n "$PKG" ] && lockver "$PKG" || echo "-" )
          if git diff --quiet -- package-lock.json package.json; then echo "changed=0" >> "$GITHUB_OUTPUT"; else echo "changed=1" >> "$GITHUB_OUTPUT"; fi
          echo "before=$before" >> "$GITHUB_OUTPUT"; echo "after=$after" >> "$GITHUB_OUTPUT"
      - name: Push fix branch
        if: steps.bump.outputs.changed == '1'
        run: |
          set -e
          PKG="${{ steps.bump.outputs.pkg }}"; DIR="${{ github.event.inputs.manifest_dir }}"
          BRANCH="security-agent/$(echo "${PKG:-audit-fix}" | tr -c "a-zA-Z0-9" "-")-${{ github.run_id }}"
          if [ -n "$PKG" ]; then TITLE="Bump $PKG from ${{ steps.bump.outputs.before }} to ${{ steps.bump.outputs.after }} in /$DIR"; else TITLE="Security fix: npm audit fix in /$DIR"; fi
          git config user.name "security-agent"; git config user.email "security-agent@users.noreply.github.com"
          git checkout -b "$BRANCH"; git add -A "$DIR"; git commit -m "$TITLE"; git push -u origin "$BRANCH"
          echo "pushed $BRANCH — the security agent opens the PR"
