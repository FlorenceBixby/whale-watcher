name: Security Fix

# Dispatched by the security agent (security-agent.burke-ruder.workers.dev) when
# Dependabot has an open alert but no PR for it. Bumps the package in the given
# manifest directory and opens a Dependabot-style PR; the agent merges it on its
# next sweep if checks pass and the bump is not a major version.

on:
  workflow_dispatch:
    inputs:
      manifest_dir:
        description: "Directory containing package.json (\".\" for repo root)"
        default: "."
      package:
        description: "npm package to update (blank = npm audit fix)"
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump
        id: bump
        working-directory: ${{ github.event.inputs.manifest_dir }}
        run: |
          set -e
          [ -f package-lock.json ] || { echo "no package-lock.json here — nothing to do"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; }
          PKG="${{ github.event.inputs.package }}"
          npm ci --ignore-scripts >/dev/null 2>&1 || npm install --ignore-scripts >/dev/null 2>&1
          before=$( [ -n "$PKG" ] && npm ls "$PKG" --depth=20 --json 2>/dev/null | python3 -c "import json,sys,re; s=json.dumps(json.load(sys.stdin)); m=re.search(r\"\\\"$PKG\\\":\\s*\\{[^}]*?\\\"version\\\":\\s*\\\"([^\\\"]+)\", s); print(m.group(1) if m else \"?\")" || echo "-" )
          if [ -n "$PKG" ]; then npm update "$PKG" --ignore-scripts; else npm audit fix --ignore-scripts || true; fi
          after=$( [ -n "$PKG" ] && npm ls "$PKG" --depth=20 --json 2>/dev/null | python3 -c "import json,sys,re; s=json.dumps(json.load(sys.stdin)); m=re.search(r\"\\\"$PKG\\\":\\s*\\{[^}]*?\\\"version\\\":\\s*\\\"([^\\\"]+)\", s); print(m.group(1) if m else \"?\")" || echo "-" )
          if git diff --quiet -- package-lock.json package.json; then echo "changed=0" >> "$GITHUB_OUTPUT"; else echo "changed=1" >> "$GITHUB_OUTPUT"; fi
          echo "before=$before" >> "$GITHUB_OUTPUT"; echo "after=$after" >> "$GITHUB_OUTPUT"
      - name: Open PR
        if: steps.bump.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PKG="${{ github.event.inputs.package }}"; DIR="${{ github.event.inputs.manifest_dir }}"
          BRANCH="security-agent/$(echo "${PKG:-audit-fix}" | tr -c "a-zA-Z0-9" "-")-${{ github.run_id }}"
          if [ -n "$PKG" ]; then TITLE="Bump $PKG from ${{ steps.bump.outputs.before }} to ${{ steps.bump.outputs.after }} in /$DIR"; else TITLE="Security fix: npm audit fix in /$DIR"; fi
          git config user.name "security-agent"; git config user.email "security-agent@users.noreply.github.com"
          git checkout -b "$BRANCH"; git add -A "$DIR"; git commit -m "$TITLE"; git push -u origin "$BRANCH"
          gh pr create --title "$TITLE" --body "Opened automatically by the security agent for an open Dependabot alert. Merged automatically on the next sweep if checks pass and this is not a major bump." --base "${{ github.event.repository.default_branch }}" --head "$BRANCH"
